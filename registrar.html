{% extends "base.html" %}

{% block contenido %}
<h2>Registrar videojuego</h2>

<form action="/registrar" method="POST">
    <p>Título: <input type="text" name="titulo" class="form-control" required></p>
    <p>Plataforma: <input type="text" name="plataforma" class="form-control" required></p>
    <p>Precio: <input type="number" name="precio" class="form-control" required></p>
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="/videojuegos" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
